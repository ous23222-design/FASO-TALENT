<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faso Talent — Accueil</title>
  <style>
    :root {
      --gold: #f5c22b;
      --dark-bg: #111114;
      --top-bg: #16161a;
      --card-bg: #ffffff;
      --text-dark: #141418;
      --text-muted: #6e6e78;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: #08080a;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--card-bg);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      padding-bottom: 94px;
      position: relative;
    }

    .top-header {
      background: var(--top-bg);
      color: #fff;
      padding: 12px 14px 0;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .free-pill {
      background: var(--gold);
      color: #111;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    .header-icons {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      position: relative;
    }

    .red-dot {
      position: absolute;
      top: 0;
      right: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff2d55;
    }

    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
    }

    .tab-item {
      background: none;
      border: none;
      color: #a8a8b2;
      font-weight: 800;
      font-size: 13px;
      padding: 10px 4px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }

    .tab-item.active {
      color: #ffffff;
      border-bottom-color: var(--gold);
    }

    .tab-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff2d55;
      margin-left: 3px;
      vertical-align: top;
    }

    .status-banner {
      margin: 8px 14px 0;
      font-size: 12px;
      font-weight: 700;
      color: #9b6b00;
      background: #fff9e3;
      padding: 7px 10px;
      border-radius: 8px;
    }

    .post-card {
      padding: 10px 0 16px;
      border-bottom: 8px solid #f0f0f4;
    }

    .feat-banner {
      background: linear-gradient(90deg, #1a6b2b, #36b34a, #1a6b2b);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.8px;
      padding: 2px 0;
    }

    .artist-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
    }

    .avatars {
      display: flex;
      align-items: center;
    }

    .avatars div {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #222;
      color: var(--gold);
      font-weight: 800;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatars div:last-child {
      margin-left: -10px;
      background: #3b2609;
    }

    .artist-names {
      font-weight: 800;
      font-size: 14px;
      color: #121216;
    }

    .verified {
      color: #1da1f2;
      font-size: 13px;
    }

    .artwork-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.05;
      background: radial-gradient(circle at 50% 35%, #594112, #121110 75%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .artwork-bg-title {
      text-align: center;
      padding: 20px;
      color: var(--gold);
    }

    .artwork-bg-title .big-script {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 46px;
      font-weight: 900;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
    }

    .artwork-bg-title .sub-cap {
      font-size: 12px;
      letter-spacing: 3px;
      color: #f3e5b5;
      margin-top: 6px;
    }

    .rank-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(20, 20, 24, 0.78);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    .featured-stack {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .featured-pill {
      background: var(--gold);
      color: #111;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    .plays-pill {
      background: rgba(18, 18, 22, 0.78);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
    }

    .play-center-btn {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(16, 16, 20, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.7);
      color: #fff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .post-actions {
      padding: 10px 14px 0;
    }

    .like-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .like-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid #2b2b33;
      background: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .like-circle.liked {
      background: #fff3c4;
      border-color: var(--gold);
    }

    .meta-line {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .caption-line {
      font-size: 14px;
      color: #16161c;
      margin-bottom: 10px;
    }

    .caption-line .tag {
      color: #4b5563;
      font-weight: 600;
    }

    .bottom-post-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    .left-social {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .social-btn, .use-beat-btn {
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #262630;
      cursor: pointer;
    }

    .use-beat-btn {
      font-size: 21px;
      font-weight: 800;
    }

    /* Barre inférieure */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      background: #141418;
      color: #fff;
      z-index: 25;
    }

    .dock-icons {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 10px;
    }

    .dock-btn {
      background: none;
      border: none;
      color: #d0d0d8;
      font-size: 20px;
      cursor: pointer;
    }

    .dock-btn.active {
      color: var(--gold);
    }

    .center-plus {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--gold);
      color: #111;
      border: none;
      font-size: 30px;
      font-weight: 900;
      cursor: pointer;
      margin-top: -18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }

    .mini-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--gold);
      color: #111;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .premium-strip {
      background: #1d1d22;
      color: #d8d8e0;
      text-align: center;
      font-size: 12px;
      padding: 6px;
      cursor: pointer;
    }

    /* Fenêtre modale interactive */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 40;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      background: #1a1a20;
      color: #fff;
      border: 1px solid #343440;
      border-radius: 16px;
      padding: 16px;
      max-height: 82vh;
      overflow-y: auto;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-title {
      color: var(--gold);
      font-weight: 800;
      font-size: 16px;
    }

    .btn-close {
      background: #2c2c38;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-gold {
      background: var(--gold);
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
    }

    input[type="text"] {
      width: 100%;
      background: #111116;
      color: #fff;
      border: 1px solid #353542;
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .list-row {
      background: #24242c;
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="top-header">
      <div class="header-row">
        <button class="free-pill" onclick="openCoinsModal()">💎 Gratuit (<span id="coinsTop">250</span>)</button>
        <div class="header-icons">
          <button class="icon-btn" onclick="openNotifsModal()">
            🔔<span class="red-dot"></span>
          </button>
          <button class="icon-btn" onclick="openMessagesModal()">➤</button>
        </div>
      </div>

      <div class="tabs-bar">
        <button class="tab-item active" id="tab-HOT" onclick="switchFeedTab('HOT')">HOT</button>
        <button class="tab-item" id="tab-RÉCENT" onclick="switchFeedTab('RÉCENT')">RÉCENT</button>
        <button class="tab-item" id="tab-MY" onclick="switchFeedTab('MY')">MY</button>
        <button class="tab-item" id="tab-ACTUS" onclick="switchFeedTab('ACTUS')">
          ACTUS<span class="tab-dot"></span>
        </button>
      </div>
    </div>

    <div class="status-banner" id="feedStatus">Fil actif : HOT • Solde : 250 pièces</div>

    <div id="feedContainer"></div>

    <div class="bottom-dock">
      <div class="dock-icons">
        <button class="dock-btn active" id="dockHome" onclick="setDock('home')">☰</button>
        <button class="dock-btn" id="dockClips" onclick="setDock('clips')">🎬</button>
        <button class="center-plus" onclick="openCreateModal()">+</button>
        <button class="dock-btn" id="dockSearch" onclick="openSearchModal()">🔍</button>
        <button class="dock-btn" id="dockProfile" onclick="openProfileModal()">
          <div class="mini-avatar">FT</div>
        </button>
      </div>
      <div class="premium-strip" onclick="openPremiumModal()">
        Expérience sans pub avec le Premium
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script>
    let coins = 250;
    let isPremium = false;
    let currentTab = "HOT";
    let playingId = null;
    let audioCtx = null;
    let beatInterval = null;
    const likedIds = new Set();

    const POSTS = [
      {
        id: 1,
        tab: "HOT",
        feat: "FEAT",
        artists: "Faso King",
        coArtist: "Bobo Flow",
        titleMain: "Déjà Vu",
        subCap: "FASO TALENT EDITION",
        rank: "#87",
        featuredLabel: "Featured ▾",
        plays: 1218,
        likes: 598,
        timeAgo: "il y a 14 heures",
        caption: "DE jAVu2 Faso King ft Bobo Flow",
        tags: "@fasotalent_officiel @bobo_rap",
        bpm: 138,
        freq: 55,
        comments: ["Lourd le refrain !", "Force depuis Bobo"]
      },
      {
        id: 2,
        tab: "RÉCENT",
        feat: "SOLO",
        artists: "Ouaga Drill",
        coArtist: "",
        titleMain: "Nuit d'Or",
        subCap: "TRAP / DRILL",
        rank: "#12",
        featuredLabel: "Boosté ▾",
        plays: 480,
        likes: 142,
        timeAgo: "il y a 2 heures",
        caption: "Nuit d'Or — Freestyle Studio",
        tags: "@fasotalent_officiel #BurkinaRap",
        bpm: 144,
        freq: 46.25,
        comments: ["Gros flow sur la prod"]
      },
      {
        id: 3,
        tab: "MY",
        feat: "STUDIO",
        artists: "Mon Son",
        coArtist: "",
        titleMain: "Brouillon 01",
        subCap: "SESSION LOCALE",
        rank: "#04",
        featuredLabel: "Perso ▾",
        plays: 75,
        likes: 18,
        timeAgo: "aujourd'hui",
        caption: "Brouillon 01 — Prêt pour mixage",
        tags: "@fasotalent_officiel",
        bpm: 96,
        freq: 49,
        comments: []
      },
      {
        id: 4,
        tab: "ACTUS",
        feat: "TOURNOI",
        artists: "Faso Battle",
        coArtist: "Saison 2026",
        titleMain: "Clash Faso",
        subCap: "INSCRIPTIONS OUVERTES",
        rank: "#01",
        featuredLabel: "Actu ▾",
        plays: 2310,
        likes: 810,
        timeAgo: "il y a 5 heures",
        caption: "Tournoi Faso Talent — Vote & Soutien",
        tags: "@fasotalent_officiel #FasoTalent",
        bpm: 120,
        freq: 65.41,
        comments: ["Je m'inscris pour le tournoi !"]
      }
    ];

    function updateStatus(msg) {
      document.getElementById("coinsTop").textContent = coins;
      document.getElementById("feedStatus").textContent = `${msg} • Solde : ${coins} pièces`;
    }

    function openModal(html) {
      document.getElementById("modalCard").innerHTML = html;
      document.getElementById("modalOverlay").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.remove("open");
    }

    function startAudioPreview(post) {
      stopAudioPreview();
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const stepMs = (60 / post.bpm / 2) * 1000;
      let step = 0;
      beatInterval = setInterval(() => {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(post.freq * (step % 4 === 0 ? 2 : 1), now);
        osc.frequency.exponentialRampToValueAtTime(post.freq * 0.7, now + 0.16);
        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.19);
        step++;
      }, stepMs);
    }

    function stopAudioPreview() {
      if (beatInterval) clearInterval(beatInterval);
      beatInterval = null;
    }

    function switchFeedTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab-item").forEach(btn => {
        btn.classList.toggle("active", btn.id === "tab-" + tab);
      });
      renderPosts();
      updateStatus("Onglet actif : " + tab);
    }

    function renderPosts() {
      const container = document.getElementById("feedContainer");
      const list = POSTS.filter(p => p.tab === currentTab);

      container.innerHTML = list.map(post => {
        const isLiked = likedIds.has(post.id);
        const isPlaying = playingId === post.id;
        return `
          <div class="post-card">
            <div class="feat-banner">${post.feat}</div>
            <div class="artist-bar">
              <div class="avatars">
                <div>${post.artists.slice(0, 2).toUpperCase()}</div>
                ${post.coArtist ? `<div>${post.coArtist.slice(0, 2).toUpperCase()}</div>` : ""}
              </div>
              <div class="artist-names">
                ${post.artists} <span class="verified">✔</span>
                ${post.coArtist ? `• ${post.coArtist} <span class="verified">✔</span>` : ""}
              </div>
            </div>

            <div class="artwork-box">
              <button class="rank-badge" onclick="openRankingModal('${post.titleMain}', '${post.rank}')">📊 ${post.rank}</button>
              <div class="featured-stack">
                <button class="featured-pill" onclick="boostPost(${post.id})">${post.featuredLabel}</button>
                <div class="plays-pill">✦ ${post.plays} Ecoutes ✦</div>
              </div>
              <div class="artwork-bg-title">
                <div class="big-script">${post.titleMain}</div>
                <div class="sub-cap">${post.subCap}</div>
              </div>
              <button class="play-center-btn" onclick="togglePlay(${post.id})">
                ${isPlaying ? "❚❚" : "▶"}
              </button>
            </div>

            <div class="post-actions">
              <div class="like-row">
                <button class="like-circle ${isLiked ? "liked" : ""}" onclick="toggleLike(${post.id})">👍</button>
                <strong>${post.likes + (isLiked ? 1 : 0)}</strong>
              </div>
              <div class="meta-line">${post.timeAgo} &nbsp; ${post.plays} écoutes</div>
              <div class="caption-line">
                ${post.caption} <span class="tag">${post.tags}</span>
              </div>
              <div class="bottom-post-bar">
                <div class="left-social">
                  <button class="social-btn" onclick="openCommentsModal(${post.id})">💬 ${post.comments.length}</button>
                  <button class="social-btn" onclick="sharePost(${post.id})">➤ Partager</button>
                </div>
                <button class="use-beat-btn" title="Utiliser ce morceau" onclick="useTrackInStudio(${post.id})">+♪</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function togglePlay(id) {
      const post = POSTS.find(p => p.id === id);
      if (!post) return;
      if (playingId === id) {
        playingId = null;
        stopAudioPreview();
        updateStatus("Pause : " + post.titleMain);
      } else {
        playingId = id;
        post.plays += 1;
        startAudioPreview(post);
        updateStatus("Lecture : " + post.titleMain);
      }
      renderPosts();
    }

    function toggleLike(id) {
      if (likedIds.has(id)) likedIds.delete(id);
      else likedIds.add(id);
      renderPosts();
      updateStatus("Like mis à jour");
    }

    function boostPost(id) {
      const post = POSTS.find(p => p.id === id);
      if (!post) return;
      if (coins < 50) {
        openCoinsModal();
        return;
      }
      coins -= 50;
      post.featuredLabel = "Boosté ★";
      renderPosts();
      updateStatus(`"${post.titleMain}" boosté (-50 pièces)`);
    }

    function openCommentsModal(id) {
      const post = POSTS.find(p => p.id === id);
      if (!post) return;
      openModal(`
        <div class="modal-top">
          <div class="modal-title">Commentaires — ${post.titleMain}</div>
          <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <div id="commentsBox">
          ${post.comments.length ? post.comments.map(c => `<div class="list-row">${c}</div>`).join("") : `<div class="list-row">Aucun commentaire pour l'instant.</div>`}
        </div>
        <input type="text" id="newCommentInput" placeholder="Écrire un commentaire..." />
        <button class="btn-gold" onclick="submitComment(${post.id})">Publier</button>
      `);
    }

    function submitComment(id) {
      const input = document.getElementById("newCommentInput");
      const text = input.value.trim();
      if (!text) return;
      const post = POSTS.find(p => p.id === id);
      post.comments.push(text);
      renderPosts();
      openCommentsModal(id);
      updateStatus("Commentaire ajouté");
    }

    function sharePost(id) {
      const post = POSTS.find(p => p.id === id);
      updateStatus(`Lien prêt pour "${post.titleMain}" (${post.tags})`);
      openModal(`
        <div class="modal-top">
          <div class="modal-title">Partager</div>
          <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <div class="list-row">Morceau : <strong>${post.titleMain}</strong> — ${post.artists}</div>
        <div class="list-row">Lien Faso Talent : https://fasotalent.app/track/${post.id}</div>
        <button class="btn-gold" onclick="closeModal()">OK</button>
      `);
    }

    function useTrackInStudio(id) {
      const post = POSTS.find(p => p.id === id);
      startAudioPreview(post);
      updateStatus(`Beat/Son "${post.titleMain}" chargé (${post.bpm} BPM)`);
    }

    function openCoinsModal() {
      openModal(`
        <div class="modal-top">
          <div class="modal-title">💎 Pièces & Boost Faso Talent</div>
          <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <div class="list-row">Solde actuel : <strong>${coins} pièces</strong></div>
        <button class="btn-gold" style="width:100%;margin-bottom:8px;" onclick="addCoins(100, 'Pack Gratuit / Pub')">+100 pièces (Gratuit / Pub)</button>
        <button class="btn-gold" style="width:100%;" onclick="addCoins(500, 'Recharge Orange Money / Coris Money')">+500 pièces (Orange Money / Coris Money)</button>
      `);
    }

    function addCoins(amount, source) {
      coins += amount;
      updateStatus(`+${amount} pièces (${source})`);
      closeModal();
    }

    function openNotifsModal() {
      openModal(`
        <div class="modal-top">
          <div class="modal-title">Notifications</div>
          <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <div class="list-row">🔥 Déjà Vu est classé #87 dans le fil HOT.</div>
        <div class="list-row">💰 Boost disponible pour 50 pièces.</div>
      `);
    }

    function openMessagesModal() {
      openModal(`
        <div class="modal-top">
          <div class="modal-title">Messages</div>
          <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <div class="list-row"><strong>Bobo Flow</strong> : On pose le prochain feat quand tu veux !</div>
        <input type="text" id="msgInput" placeholder="Envoyer un message..." />
        <button class="btn-gold" onclick="closeModal(); updateStatus('Message envoyé');">Envoyer</button>
      `);
    }

    function openRankingModal(title, rank) {
      openModal(`
        <div class="modal-top">
          <div class="modal-title">Classement ${rank}</div>
          <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <div class="list-row">Titre : <strong>${title}</strong></div>
        <div class="list-row">Position actuelle : <strong>${rank}</strong> sur Faso Talent.</div>
      `);
    }

    function openCreateModal() {
      openModal(`
        <div class="modal-top">
          <div class="modal-title">Créer sur Faso Talent (+)</div>
          <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <button class="btn-gold" style="width:100%;margin-bottom:8px;" onclick="quickPublish('HOT')">Publier un son dans HOT</button>
        <button class="btn-gold" style="width:100%;" onclick="quickPublish('MY')">Enregistrer dans MY</button>
      `);
    }

    function quickPublish(targetTab) {
      const nextId = POSTS.length + 1;
      POSTS.unshift({
        id: nextId,
        tab: targetTab,
        feat: "NEW",
        artists: "Faso Artiste",
        coArtist: "",
        titleMain: "Flow Faso #" + nextId,
        subCap: "STUDIO FASO TALENT",
        rank: "#" + nextId,
        featuredLabel: "Nouveau ▾",
        plays: 1,
        likes: 1,
        timeAgo: "à l'instant",
        caption: "Flow Faso #" + nextId + " — Nouveau titre",
        tags: "@fasotalent_officiel",
        bpm: 130,
        freq: 55,
        comments: []
      });
      switchFeedTab(targetTab);
      closeModal();
      updateStatus(`Nouveau titre ajouté dans ${targetTab}`);
    }

    function openSearchModal() {
      openModal(`
        <div class="modal-top">
          <div class="modal-title">Rechercher</div>
          <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <input type="text" id="searchQuery" placeholder="Nom d'artiste ou titre..." oninput="filterSearch()" />
        <div id="searchResults">
          ${POSTS.map(p => `<div class="list-row"><strong>${p.titleMain}</strong> — ${p.artists} (${p.tab})</div>`).join("")}
        </div>
      `);
    }

    function filterSearch() {
      const q = document.getElementById("searchQuery").value.toLowerCase();
      const matches = POSTS.filter(p => p.titleMain.toLowerCase().includes(q) || p.artists.toLowerCase().includes(q));
      document.getElementById("searchResults").innerHTML = matches.length
        ? matches.map(p => `<div class="list-row"><strong>${p.titleMain}</strong> — ${p.artists} (${p.tab})</div>`).join("")
        : `<div class="list-row">Aucun résultat.</div>`;
    }

    function openProfileModal() {
      openModal(`
        <div class="modal-top">
          <div class="modal-title">Profil Faso Talent</div>
          <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <div class="list-row">Artiste : <strong>@faso_talent</strong></div>
        <div class="list-row">Solde : <strong>${coins} pièces</strong> • Premium : <strong>${isPremium ? "Actif" : "Non"}</strong></div>
        <button class="btn-gold" onclick="closeModal()">Fermer</button>
      `);
    }

    function openPremiumModal() {
      openModal(`
        <div class="modal-top">
          <div class="modal-title">Faso Talent Premium</div>
          <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <div class="list-row">Sans publicité + badge artiste + bonus de pièces.</div>
        <button class="btn-gold" onclick="isPremium = true; coins += 200; closeModal(); updateStatus('Premium activé (+200 pièces)');">Activer Premium (+200 pièces)</button>
      `);
    }

    function setDock(name) {
      stopAudioPreview();
      playingId = null;
      document.querySelectorAll(".dock-btn").forEach(b => b.classList.remove("active"));
      if (name === "home") {
        document.getElementById("dockHome").classList.add("active");
        renderPosts();
        updateStatus("Accueil actif");
      } else if (name === "clips") {
        document.getElementById("dockClips").classList.add("active");
        updateStatus("Mode Clips & Vidéos sélectionné");
      }
    }

    renderPosts();
  </script>
</body>
</html>
